services:
  flight-tracker-app:
    image: flight-tracker-spring:latest
    build:
      context: .
      dockerfile: dockerfile
    container_name: flight-tracker-spring
    depends_on:
      - kafka
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "3000:3000"
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: flight-tracker-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: flight-tracker-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:17
    container_name: flight-tracker-postgres
    environment:
      POSTGRES_DB: flight_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ZAQ12wsx
    ports:
      - "5432:5432"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d:ro

