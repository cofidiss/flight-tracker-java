spring.application.name=flight-tracker-java
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=flightGroup

# Producer Ayarlar? (Mesaj Gönderen)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.trusted.packages=com.flight.core.domain
# Consumer Ayarlar? (Mesaj Dinleyen)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.flight.core.domain

spring.security.enabled=false

# PostgreSQL ba?lant? ayarlar?
spring.datasource.url=jdbc:postgresql://localhost:5432/flight_tracker
spring.datasource.username=postgres
spring.datasource.password=""

# PostgreSQL sürücüsü
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA (Hibernate) ayarlar?
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
spring.aop.auto=true
spring.aop.proxy-target-class=true


